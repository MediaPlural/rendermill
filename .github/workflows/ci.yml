name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: install render deps (ffmpeg for real-clip tests, espeak-ng for local-TTS tests)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg espeak-ng
      - run: pip install -q -e . pytest
      - run: pytest -q
