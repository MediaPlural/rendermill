<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="_shared.css">
  <style>
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .command {
      font-family: var(--mono);
      font-size: 58px;
      font-weight: 700;
      color: var(--ember);
      background: var(--card);
      border: 1px solid var(--edge);
      border-radius: 16px;
      padding: 30px 44px;
      display: inline-block;
      margin-top: 32px;
      align-self: flex-start;
    }
    .command .prompt { color: var(--faint); }
    .tagline {
      font-size: 30px;
      line-height: 1.45;
      color: var(--faint);
      max-width: 1200px;
      margin-top: 30px;
    }
  </style>
</head>
<body class="canvas landscape">
  <div class="stage">
    <div class="kicker">Step three</div>
    <h2 class="title">Ship it.</h2>
    <div class="command"><span class="prompt">$</span> rendermill render</div>
    <p class="tagline">
      You get an MP4 in the <span class="accent">out/</span> folder.
      That's the whole thing.
    </p>
  </div>
</body>
</html>
