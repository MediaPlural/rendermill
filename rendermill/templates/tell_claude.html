<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="_shared.css">
  <style>
    .conversation {
      display: flex;
      flex-direction: column;
      gap: 30px;
      max-width: 1280px;
      margin-top: 36px;
    }
    .bubble {
      background: var(--card);
      border: 1px solid var(--edge);
      border-radius: 20px;
      padding: 26px 34px;
      font-size: 32px;
      line-height: 1.5;
      color: var(--paper);
      max-width: 1020px;
    }
    .bubble.speaker {
      align-self: flex-start;
      background: rgba(255, 180, 84, 0.09);
      border-color: var(--ember);
    }
    .who {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ember);
      margin-bottom: 10px;
    }
  </style>
</head>
<body class="canvas landscape">
  <div class="kicker">Step one</div>
  <h2 class="title">Tell your agent what you want.</h2>
  <div class="conversation">
    <div class="bubble speaker">
      <div class="who">You</div>
      Make me a thirty-second video explaining what an SSD does.
    </div>
  </div>
</body>
</html>
