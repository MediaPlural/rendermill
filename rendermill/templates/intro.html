<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="_shared.css">
  <style>
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .wordmark {
      font-size: 120px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      margin: 0 0 28px;
    }
    .wordmark .dot { color: var(--ember); }
    .tagline {
      font-size: 34px;
      line-height: 1.4;
      color: var(--faint);
      max-width: 1100px;
    }
    body.canvas.portrait .wordmark { font-size: 92px; }
    body.canvas.portrait .tagline  { font-size: 38px; }
  </style>
</head>
<body class="canvas landscape">
  <div class="stage">
    <div class="kicker">Narrated slide videos</div>
    <h1 class="wordmark">render<span class="dot">mill</span></h1>
    <p class="tagline">
      Describe the video you want. Your agent writes the slides and the
      narration. You get a finished MP4.
    </p>
  </div>
</body>
</html>
