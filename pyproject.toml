[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rendermill"
version = "0.9.0"
description = "Rendermill — narrated slide videos from HTML + a storyboard."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Justin Sharpe" }]
license = { text = "MIT" }
keywords = ["video", "tts", "elevenlabs", "fal", "narration", "slides", "lipsync"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "Pillow>=10.0",
  # Ships an ffmpeg binary built WITH libass. The system ffmpeg (homebrew,
  # distro packages) commonly lacks the `ass` filter, and without it caption
  # burn silently degrades to "raw MP4 + SRT sidecar". Declaring it makes a
  # burned-in-captions render the default instead of a lucky accident.
  "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
rendermill = "rendermill.cli:main"

[project.urls]
Homepage = "https://github.com/MediaPlural/rendermill"
Issues = "https://github.com/MediaPlural/rendermill/issues"

[tool.setuptools.packages.find]
include = ["rendermill*"]

[tool.setuptools.package-data]
rendermill = [
  "templates/*.html",
  "templates/*.css",
  "assets/*.png",
  "skill_data/**/*.md",
]
